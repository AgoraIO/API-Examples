name: Create Tag

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'push or delete'
        required: false
        type: choice
        default: push
        options:
          - push
          - delete
      tag:
        description: 'Tag name'
        required: true
        type: string
      message:
        description: 'Tag message (used when action is push)'
        required: false
        type: string
        default: ''

jobs:
  tag-job:
    name: Tag ${{ inputs.action }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate tag name
        env:
          TAG: ${{ inputs.tag }}
        run: git check-ref-format "refs/tags/$TAG"

      - name: Push tag
        if: inputs.action == 'push'
        env:
          TAG: ${{ inputs.tag }}
          TAG_MESSAGE: ${{ inputs.message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$TAG_MESSAGE" ]; then
            git tag -a -m "$TAG_MESSAGE" -- "$TAG"
          else
            git tag -- "$TAG"
          fi
          git push origin "refs/tags/$TAG:refs/tags/$TAG"

      - name: Delete tag
        if: inputs.action == 'delete'
        env:
          TAG: ${{ inputs.tag }}
        run: git push origin ":refs/tags/$TAG"
