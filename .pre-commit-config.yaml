repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: Scan staged changes for sensitive information
        description: Rejects staged changes containing sensitive information
        entry: .git-hooks/run-gitleaks.sh
        args: ["--config=.gitleaks.toml", "--verbose"]
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: check-commit-message
        name: Check commit message for Chinese characters
        description: Ensures commit messages do not contain Chinese characters
        entry: .git-hooks/check-commit-message.sh
        language: script
        stages: [commit-msg]
