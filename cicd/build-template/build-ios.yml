parameters:
  displayName: ''
  workingDirectory: ''
  project: ''
  scheme: ''

jobs:
  - job: ${{ parameters.displayName }}Build
    displayName: ${{ parameters.displayName }}

    pool:
      vmImage: 'macOS-latest'

    variables:
      - group: AgoraKeys

    steps:
      - script: cd 'cicd/scripts' && ls && python keycenter.py && ls
        displayName: 'Generate KeyCenter'
        env:
          AGORA_APP_ID: $(agora.appId)
          File_Directory: '../../${{ parameters.workingDirectory }}/${{ parameters.project }}/Common'

      - script: cd 'cicd/scripts' && chmod +x ios_build.sh && ./ios_build.sh ../../${{ parameters.workingDirectory }} ${{ parameters.project }} ${{ parameters.scheme }}
        displayName: 'Build without code signing'
